aid: workspan
name: WorkSpan
description: WorkSpan is an ecosystem business management platform that helps companies run co-sell, marketplace,
  and channel partnerships with cloud hyperscalers such as AWS, Microsoft, and Google Cloud. Its public APIs, published
  on an Azure API Management developer portal, cover OAuth 2.0 authentication, co-sell actions and CRM opportunity
  validation, bulk data loading, webhook event subscriptions, cloud marketplace offers and usage reporting, report
  data access, and SCIM 2.0 user provisioning.
